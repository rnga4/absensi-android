<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Absensi Karyawan" />
  <title>Absensi Karyawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-hero">
      <div class="header-top">
        <h1 class="app-title">Absensi Karyawan</h1>
        <span id="statusPulse" class="status-indicator"></span>
      </div>
      <p id="summary" class="summary">Memuat status...</p>
    </div>
    <div class="search-container">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M9.5 3a6.5 6.5 0 1 0 4.1 11.53l4.94 4.94a1 1 0 0 0 1.41-1.41l-4.93-4.94A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Cari nama karyawan..." autocomplete="off" />
        <button id="clearSearch" class="btn-clear hidden" aria-label="Hapus pencarian">&times;</button>
      </div>
    </div>
  </header>

  <main>
    <div id="skeleton" class="skeleton-container hidden">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
    <div id="list" class="list-container"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">👥</div>
      <p class="empty-title">Tidak ada data karyawan</p>
      <p class="empty-sub">Coba kata kunci pencarian lain</p>
    </div>
    <p id="error" class="state-msg hidden"></p>

    <button id="fabRefresh" class="fab" aria-label="Refresh" title="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </main>

  <button id="installPrompt" class="hidden">Install Aplikasi</button>

  <script src="js/app.js"></script>
</body>
</html>
